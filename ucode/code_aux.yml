# mnemonics to simplify microcode writing
mnemonics:
    base_addr_W:            0
    base_addr_x:            1
    weights_kim_iter:       2
    weights_kim_set:        3
    infeat_kim_iter:        4
    infeat_kim_set:         5

# Uaux RESILIENCE code
code:
  k_in_major:
    - { op : add,  a: base_addr_W, b: weights_kim_iter  }
    - { op : add,  a: base_addr_x, b: infeat_kim_iter   }
